<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GitLane — choisir un dépôt</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #f2f2f7;
    color: #1c1c1e;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 40px 16px 60px;
  }
  .card {
    width: min(760px, 100%);
    background: #fff;
    border: 1px solid #e5e5ea;
    border-radius: 12px;
    box-shadow: 0 2px 10px rgba(16, 24, 40, .06);
    padding: 20px 24px;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  h1 .logo {
    width: 22px; height: 22px; border-radius: 6px;
    background: linear-gradient(135deg, #d6409f, #0091ff);
    display: inline-block;
  }
  .subtitle { color: #8e8e93; font-size: 13px; margin: 0 0 18px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .card-head h1 { margin: 0; }
  .lang-toggle { display: inline-flex; border: 1px solid #e5e5ea; border-radius: 8px; overflow: hidden; }
  .lang-toggle button {
    height: 26px; padding: 0 10px; border: none; background: #fff;
    font-size: 11px; font-weight: 700; letter-spacing: .03em; cursor: pointer; color: #8e8e93;
  }
  .lang-toggle button:hover { background: #eef3fb; }
  .lang-toggle button.active { background: #0091ff; color: #fff; }
  h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
    color: #8e8e93; margin: 18px 0 8px;
  }
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px;
    border: 1px solid transparent;
    cursor: pointer;
  }
  .row:hover { background: #eef3fb; border-color: #e5e5ea; }
  .row .name { font-weight: 600; font-size: 13.5px; }
  .row .path { color: #8e8e93; font-size: 12px; font-family: Menlo, Consolas, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .btn { margin-left: auto; }
  .empty { color: #8e8e93; font-size: 13px; padding: 10px; text-align: center; }
  input[type="text"], select {
    height: 32px; border: 1px solid #e5e5ea; border-radius: 8px;
    padding: 0 10px; font-size: 13px; width: 100%;
    outline: none; font-family: inherit;
  }
  input:focus, select:focus { border-color: #0091ff; }
  button {
    height: 32px; padding: 0 14px; border-radius: 8px;
    border: 1px solid #e5e5ea; background: #fff;
    font-size: 13px; font-weight: 600; cursor: pointer; color: #1c1c1e;
  }
  button:hover { background: #eef3fb; }
  button.primary { background: #0091ff; border-color: #0091ff; color: #fff; }
  button.primary:hover { background: #0077d6; }
  button:disabled { opacity: .5; cursor: default; }
  .row .btn { background: transparent; border-color: transparent; color: #0091ff; }
  .row:hover .btn { border-color: #c4dcfc; background: #fff; }
  .formline { display: flex; gap: 8px; }
  .formline input { flex: 1; }
  .scan-results { margin-top: 10px; border: 1px solid #e5e5ea; border-radius: 8px; max-height: 260px; overflow: auto; }
  .scan-results .row .btn { display: none; }
  .scan-results .row:hover .btn { display: inline-flex; }
  .err { color: #e54d2e; font-size: 13px; margin-top: 8px; min-height: 18px; }
  .hint { color: #8e8e93; font-size: 12px; margin-top: 6px; }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid #e5e5ea; border-top-color: #0091ff;
    border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <div class="card-head">
      <h1><span class="logo"></span> GitLane</h1>
      <div class="lang-toggle" role="group" aria-label="Language">
        <button type="button" data-lang="fr">FR</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
    <p class="subtitle" data-i18n="subtitle">Choisir un dépôt Git à visualiser</p>

    <h2 data-i18n="recent">Récents</h2>
    <div id="recents"><div class="empty" data-i18n="loading">Chargement…</div></div>

    <h2 data-i18n="browse">Parcourir</h2>
    <div class="formline">
      <input id="root" type="text" data-i18n-ph="root_ph" placeholder="Dossier racine (absolu), ex : C:\Users\Dell\Desktop\MesProjets" />
      <select id="depth">
        <option value="1" data-i18n="depth_1">1 niveau</option>
        <option value="2" data-i18n="depth_2">2 niveaux</option>
        <option value="3" data-i18n="depth_3">3 niveaux</option>
      </select>
      <button id="scanBtn" data-i18n="scan">Scanner</button>
    </div>
    <div class="scan-results" id="scanResults" hidden></div>
    <div class="hint" data-i18n="scan_hint">Ne scanne que les dossiers contenant un sous-dossier <code>.git</code> — profondeur limitée.</div>

    <h2 data-i18n="manual">Manuel</h2>
    <div class="formline">
      <input id="manual" type="text" data-i18n-ph="manual_ph" placeholder="Chemin absolu d'un dépôt git" />
      <button id="openBtn" class="primary" data-i18n="open">Ouvrir</button>
    </div>
    <div class="err" id="err"></div>
  </div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const $err = $("err");

/* ---- i18n (shares the `gitlane.locale` key with the React app) ---- */
const STORAGE_KEY = "gitlane.locale";
const I18N = {
  fr: {
    subtitle: "Choisir un dépôt Git à visualiser",
    recent: "Récents", loading: "Chargement…", browse: "Parcourir",
    root_ph: "Dossier racine (absolu), ex : C:\\Users\\Dell\\Desktop\\MesProjets",
    depth_1: "1 niveau", depth_2: "2 niveaux", depth_3: "3 niveaux",
    scan: "Scanner",
    scan_hint: "Ne scanne que les dossiers contenant un sous-dossier <code>.git</code> — profondeur limitée.",
    manual: "Manuel", manual_ph: "Chemin absolu d'un dépôt git", open: "Ouvrir",
    no_recent: "Aucun dépôt ouvert récemment.",
    need_root: "Indique un dossier racine.",
    scanning: '<span class="spinner"></span> Scan en cours…',
    no_git_found: "Aucun dépôt git trouvé ici.",
    scan_error: "Erreur pendant le scan.",
    need_path: "Indique un chemin absolu.",
    error_status: "Erreur {status}",
  },
  en: {
    subtitle: "Choose a Git repository to visualize",
    recent: "Recent", loading: "Loading…", browse: "Browse",
    root_ph: "Root folder (absolute), e.g. C:\\Users\\Dell\\Desktop\\MesProjets",
    depth_1: "1 level", depth_2: "2 levels", depth_3: "3 levels",
    scan: "Scan",
    scan_hint: "Only scans folders containing a <code>.git</code> subfolder — limited depth.",
    manual: "Manual", manual_ph: "Absolute path of a git repository", open: "Open",
    no_recent: "No recently opened repositories.",
    need_root: "Please provide a root folder.",
    scanning: '<span class="spinner"></span> Scanning…',
    no_git_found: "No git repository found here.",
    scan_error: "Error during scan.",
    need_path: "Please provide an absolute path.",
    error_status: "Error {status}",
  },
};

function detectLocale() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved === "fr" || saved === "en") return saved;
  } catch (e) { /* ignore */ }
  return (navigator.language || "").toLowerCase().startsWith("fr") ? "fr" : "en";
}

let locale = detectLocale();

function t(key, vars) {
  let s = (I18N[locale] && I18N[locale][key]) || I18N.en[key] || key;
  if (vars) for (const k in vars) s = s.split("{" + k + "}").join(String(vars[k]));
  return s;
}

function applyStatic() {
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    el.innerHTML = t(el.getAttribute("data-i18n"));
  });
  document.querySelectorAll("[data-i18n-ph]").forEach((el) => {
    el.setAttribute("placeholder", t(el.getAttribute("data-i18n-ph")));
  });
  document.querySelectorAll(".lang-toggle button").forEach((b) => {
    b.classList.toggle("active", b.getAttribute("data-lang") === locale);
  });
}

function setLocale(next) {
  locale = next;
  try { localStorage.setItem(STORAGE_KEY, next); } catch (e) { /* ignore */ }
  applyStatic();
}

document.querySelectorAll(".lang-toggle button").forEach((b) => {
  b.addEventListener("click", () => setLocale(b.getAttribute("data-lang")));
});

function showError(msg) {
  $err.textContent = msg || "";
}

async function openPath(path) {
  showError("");
  const btn = $("openBtn");
  btn.disabled = true;
  try {
    const res = await fetch("/repos/open", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok || !body.ok) {
      showError(body.detail || t("error_status", { status: res.status }));
      return;
    }
    window.location.href = "/";
  } catch (e) {
    showError(String(e));
  } finally {
    btn.disabled = false;
  }
}

function renderRecents(items) {
  const box = $("recents");
  if (!items.length) {
    box.innerHTML = '<div class="empty">' + t("no_recent") + "</div>";
    return;
  }
  box.innerHTML = "";
  for (const it of items) {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<span class="name"></span><span class="path"></span><button class="btn">${t("open")}</button>`;
    row.querySelector(".name").textContent = it.name || "?";
    row.querySelector(".path").textContent = it.path;
    row.querySelector(".btn").addEventListener("click", (e) => { e.stopPropagation(); openPath(it.path); });
    row.addEventListener("click", () => openPath(it.path));
    box.appendChild(row);
  }
}

async function loadRecents() {
  try {
    const res = await fetch("/repos/recent");
    renderRecents(await res.json());
  } catch (e) {
    renderRecents([]);
  }
}

$("scanBtn").addEventListener("click", async () => {
  const root = $("root").value.trim();
  const depth = parseInt($("depth").value, 10) || 1;
  const box = $("scanResults");
  const btn = $("scanBtn");
  showError("");
  if (!root) { showError(t("need_root")); return; }
  btn.disabled = true;
  box.hidden = false;
  box.innerHTML = '<div class="empty">' + t("scanning") + "</div>";
  try {
    const res = await fetch(`/repos/browse?root=${encodeURIComponent(root)}&depth=${depth}`);
    const data = await res.json();
    const items = data.items || [];
    if (!items.length) {
      box.innerHTML = '<div class="empty">' + t("no_git_found") + "</div>";
      return;
    }
    box.innerHTML = "";
    for (const it of items) {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `<span class="name"></span><span class="path"></span><button class="btn">${t("open")}</button>`;
      row.querySelector(".name").textContent = it.name;
      row.querySelector(".path").textContent = it.path;
      row.querySelector(".btn").addEventListener("click", (e) => { e.stopPropagation(); openPath(it.path); });
      row.addEventListener("click", () => openPath(it.path));
      box.appendChild(row);
    }
  } catch (e) {
    box.innerHTML = '<div class="empty">' + t("scan_error") + "</div>";
  } finally {
    btn.disabled = false;
  }
});

$("openBtn").addEventListener("click", () => {
  const path = $("manual").value.trim();
  if (!path) { showError(t("need_path")); return; }
  openPath(path);
});
$("manual").addEventListener("keydown", (e) => { if (e.key === "Enter") $("openBtn").click(); });
$("root").addEventListener("keydown", (e) => { if (e.key === "Enter") $("scanBtn").click(); });

applyStatic();
loadRecents();
</script>
</body>
</html>
